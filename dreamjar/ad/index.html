<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쭉심 ZZUKSIM — Ho Chi Minh City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  .ad { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .s1 {
    background-image: url('slide1.png');
    animation: fadeOut 5s ease forwards;
  }
  .s2 {
    background-image: url('slide2.png');
    opacity: 0;
    animation: fadeIn 5s ease forwards;
  }
  @keyframes fadeOut {
    0%   { opacity: 1; transform: scale(1); }
    45%  { opacity: 1; transform: scale(1.04); }
    60%  { opacity: 0; transform: scale(1.06); }
    100% { opacity: 0; }
  }
  @keyframes fadeIn {
    0%   { opacity: 0; transform: scale(1.06); }
    45%  { opacity: 0; transform: scale(1.06); }
    60%  { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
  }
  .bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 2;
    background: linear-gradient(90deg, #e8432a, #ff6b4a, #e8432a);
    transform: scaleX(0); transform-origin: left;
    animation: grow 5s linear forwards;
  }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
</head>
<body>
<div class="ad">
  <div class="bar"></div>
  <div class="slide s1"></div>
  <div class="slide s2"></div>
</div>
</body>
</html>
